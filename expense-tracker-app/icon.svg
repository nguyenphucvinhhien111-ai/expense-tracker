<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Wallet / Ledger Shape -->
  <g filter="url(#shadow)">
    <!-- Wallet base -->
    <rect x="96" y="140" width="320" height="232" rx="36" fill="#1e1b4b" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
    <!-- Wallet flap -->
    <path d="M 96 190 Q 256 260 416 190 L 416 140 Q 256 180 96 140 Z" fill="#2e1065" opacity="0.6"/>
    <!-- Wallet clasp -->
    <rect x="330" y="226" width="90" height="60" rx="18" fill="#4338ca" stroke="#818cf8" stroke-width="3"/>
    <!-- Golden Coin in clasp -->
    <circle cx="375" cy="256" r="16" fill="url(#coinGrad)"/>
    <text x="375" y="263" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#713f12" text-anchor="middle">₫</text>
  </g>
  
  <!-- Trend Up Arrow (Green Glow) -->
  <g transform="translate(140, 220)">
    <circle cx="44" cy="44" r="38" fill="#10b981" opacity="0.2"/>
    <path d="M 28 56 L 60 24 M 60 24 L 38 24 M 60 24 L 60 46" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
