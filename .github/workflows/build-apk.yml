name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Android directory
        id: locate-dir
        run: |
          if [ -d "expense-tracker-app/android" ]; then
            echo "dir=expense-tracker-app/android" >> $GITHUB_OUTPUT
          elif [ -d "android" ]; then
            echo "dir=android" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android environment
        run: |
          DIR="${{ steps.locate-dir.outputs.dir }}"
          sed -i 's/\r$//' "$DIR/gradlew"
          chmod +x "$DIR/gradlew"
          echo "sdk.dir=$ANDROID_HOME" > "$DIR/local.properties"
          mkdir -p ~/.android
          if [ -f "$DIR/app/debug.keystore" ]; then
            cp "$DIR/app/debug.keystore" ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore "$DIR/app/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp "$DIR/app/debug.keystore" ~/.android/debug.keystore
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate-dir.outputs.dir }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1 || STATUS=$?
          if [ "${STATUS:-0}" -ne 0 ]; then
            cat build.log
            ERR=$(grep -E "FAILURE:|What went wrong:|Caused by:|error:" build.log -A 3 | head -n 20 | tr '\r\n' ' | ')
            echo "::error title=Gradle Failure::$ERR"
            exit $STATUS
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: ${{ steps.locate-dir.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
