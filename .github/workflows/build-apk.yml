name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Locate Android directory
        id: locate-dir
        run: |
          if [ -d "expense-tracker-app/android" ]; then
            echo "dir=expense-tracker-app/android" >> $GITHUB_OUTPUT
          elif [ -d "android" ]; then
            echo "dir=android" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare gradlew executable
        run: |
          sed -i 's/\r$//' ${{ steps.locate-dir.outputs.dir }}/gradlew
          chmod +x ${{ steps.locate-dir.outputs.dir }}/gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.locate-dir.outputs.dir }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Publish Build Failure Summary
        if: failure()
        run: |
          DIR="${{ steps.locate-dir.outputs.dir }}"
          echo "## ❌ Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f "$DIR/build.log" ]; then
            tail -n 80 "$DIR/build.log" >> $GITHUB_STEP_SUMMARY
          else
            echo "No build.log found" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SoThuChi-Debug-APK
          path: ${{ steps.locate-dir.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          retention-days: 14
